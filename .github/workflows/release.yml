name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and version
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Run offline tests
        run: tests/test_cli.sh
      - name: Build release assets
        run: scripts/package-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/workstation-*.tar.gz
          dist/workstation-*.tar.gz.sha256 dist/workstation-installer.sh
          --title "Workstation ${GITHUB_REF_NAME#v}" --generate-notes
